defaults:
  - marlin_nplib1
  - _self_

# EFlow/EFM is an experimental architecture inspired by arXiv:2607.21585.
# It is never reported as the strict arXiv:2607.04774 MARLIN reproduction.
architecture: expanding
stage: eflow
teacher_checkpoint: null
allow_dirty_worktree: false

flow:
  prior_scale: 1.25
  insertion_cutoff: 0.5
  insertion_loss_weight: 1.0
  time_embedding_size: 128
  time_fourier_dim: 64
  time_warp_points: 2048
  time_warp_quadrature: 48
  diagonal_probability: 0.75
  boundary_probability: 0.03125
  adaptive_loss_c: 1.0e-6
  adaptive_loss_r: 0.5
  insertion_detach_steps: 2000
  sampling_time_floor: 1.0e-3

optim:
  learning_rate: 3.0e-4
  weight_decay: 0.0
  warmup_steps: 2500

training:
  # Experimental FRIGID adaptation for newly introduced flow modules.
  flow_modules_only_steps: 500

loader:
  batch_size: 8
  num_workers: 8

trainer:
  devices: 1
  precision: bf16-mixed
  max_steps: 200000
  # Paper sequence recipe uses global batch 512.
  accumulate_grad_batches: 64
  gradient_clip_val: 1.0
  log_every_n_steps: 50

evaluation:
  expanding_steps: 32

output:
  root: /mnt/netstorage/nikolenko/marlin/runs/expanding/eflow
  checkpoints: /mnt/netstorage/nikolenko/marlin/runs/expanding/eflow/checkpoints
  checkpoint_interval: 5000

tracking:
  clearml:
    enabled: true
    project_name: MARLIN clean-room reproduction
    task_name: expanding-marlin-eflow
    tags:
      - experimental
      - non-paper-architecture
      - arxiv-2607.21585
      - conditional-EFlow
      - SAFE
