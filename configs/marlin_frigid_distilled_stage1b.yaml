# Controlled recovery lane after stage1 failed its rollout-action gate.
# This is FRIGID-distilled MARLIN, not a strict paper reproduction.
defaults:
  - marlin_frigid_distilled_stage1
  - _self_

# Supply the selected stage-0 checkpoint as a Hydra/Slurm override. This keeps
# trainable scope, KL weight, data, and seed fixed while correcting only the
# rollout objective.
resume_weights_only_checkpoint: ???

adaptation:
  stage: stage1b-block32-next-token
  trainable_scope: attention_bridge
  block_width_override: 32
  current_block_masking: continuous_time
  full_block_mask_probability: 0.25
  rollout_prefix_probability: 0.5
  kl_weight: 0.5

model:
  block_width: 32

optim:
  learning_rate: 1.0e-5

trainer:
  max_steps: 500

output:
  root: /mnt/netstorage/nikolenko/marlin/runs/frigid-distilled-stage1b-block32
  checkpoints: /mnt/netstorage/nikolenko/marlin/runs/frigid-distilled-stage1b-block32/checkpoints

tracking:
  clearml:
    task_name: frigid-distilled-marlin-stage1b-block32-next-token
    tags:
      - FRIGID-distilled-MARLIN
      - not-strict-reproduction
      - stage-1b
      - block-attention-32
      - attention-bridge
      - next-token-rollout-distillation
      - raw-molecular-validation
      - formula-teacher
      - fingerprint-teacher
