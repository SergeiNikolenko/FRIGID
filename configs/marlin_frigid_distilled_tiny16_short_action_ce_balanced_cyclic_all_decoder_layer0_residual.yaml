# Diagnostic-only 4-to-16 capacity scaling gate on short SAFE structures.
# This is FRIGID-distilled MARLIN, not a strict paper reproduction or benchmark.
defaults:
  - marlin_frigid_distilled_tiny_overfit_c16h12o3_action_ce_balanced_cyclic_all_decoder_layer0_residual
  - _self_

# Load only decoder weights from the recovered tiny-4 checkpoint and start a
# fresh optimizer. The source checkpoint SHA-256 is recorded in the run config.
resume_checkpoint: null
resume_weights_only_checkpoint: /mnt/netstorage/nikolenko/marlin/runs/frigid-distilled-tiny-c16h12o3-action-ce-balanced-cyclic-all-decoder-layer0-residual-f5aa00b-resume256-to1024/checkpoints/step=1024.ckpt

adaptation:
  stage: diagnostic-tiny16-short-action-ce-balanced-cyclic-all-decoder-layer0-residual

data:
  metadata_csv: /mnt/netstorage/nikolenko/marlin/datasets/marlin-overfit/tiny16-short-safe.csv
  metadata_csv_sha256: 0e7dcf36a25fa568e2d213c7000f344ac426d986d2e370b46947480bad777c86

# A full 16-row batch prevents the global cyclic-prefix schedule from aliasing
# molecule identity with only a subset of its target-prefix positions.
loader:
  batch_size: 16
  num_workers: 0

optim:
  learning_rate: 5.0e-5

trainer:
  max_steps: 512
  accumulate_grad_batches: 1
  log_every_n_steps: 5

training:
  metric_interval: 5
  molecular_validation_csv: /mnt/netstorage/nikolenko/marlin/datasets/marlin-overfit/tiny16-short-safe.csv
  molecular_validation_interval: 128
  molecular_validation_samples: 16
  molecular_validation_candidates: 1
  molecular_validation_use_ema: false

output:
  root: /mnt/netstorage/nikolenko/marlin/runs/frigid-distilled-tiny16-short-action-ce-balanced-cyclic-all-decoder-layer0-residual-init-tiny4-step1024-to512
  checkpoints: /mnt/netstorage/nikolenko/marlin/runs/frigid-distilled-tiny16-short-action-ce-balanced-cyclic-all-decoder-layer0-residual-init-tiny4-step1024-to512/checkpoints
  checkpoint_interval: 128

tracking:
  clearml:
    task_name: frigid-distilled-marlin-tiny16-short-layer0-residual
    tags:
      - FRIGID-distilled-MARLIN
      - not-strict-reproduction
      - diagnostic-only
      - tiny16-short-overfit
      - capacity-scale-gate
      - block-attention-32
      - all-decoder
      - full-decoder-finetune
      - production-action-ce
      - rollout-prefix-only
      - kl-zero
      - balanced-token-loss
      - deterministic-cyclic-prefix
      - deterministic-dropout
      - raw-molecular-validation
      - layer0-long-residual
      - fixed-residual-scale-1
      - weights-only-from-tiny4-step1024
      - init-checkpoint-sha18ee95ef
