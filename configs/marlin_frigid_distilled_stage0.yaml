# Opt-in experimental lane: FRIGID-distilled MARLIN, not paper reproduction.
defaults:
  - marlin_nplib1
  - _self_

frigid_warm_start_checkpoint: /mnt/netstorage/nikolenko/marlin/checkpoints/frigid/DLM.ckpt
frigid_warm_start_sha256: b6177c2d43448380aba80ff41c01461ea34ca2ca93b213986954c5afb7f0f457

adaptation:
  mode: frigid_distilled_marlin
  stage: stage0-full-attention
  trainable_scope: mass_only
  teacher_checkpoint: /mnt/netstorage/nikolenko/marlin/checkpoints/frigid/DLM.ckpt
  teacher_sha256: b6177c2d43448380aba80ff41c01461ea34ca2ca93b213986954c5afb7f0f457
  attention_mode: frigid_full
  current_block_masking: full
  full_block_mask_probability: 0.0
  rollout_prefix_probability: 0.0
  # Defines the fair current/suffix masking block. Attention itself is explicit
  # full attention and does not use this width as an approximation.
  block_width_override: 256
  temperature: 2.0
  kl_weight: 1.0
  use_isotope: false

optim:
  learning_rate: 1.0e-4
  weight_decay: 0.0

trainer:
  devices: 1
  precision: bf16-mixed
  max_steps: 500
  accumulate_grad_batches: 32
  log_every_n_steps: 10

training:
  metric_interval: 10
  molecular_validation_interval: 100

output:
  root: /mnt/netstorage/nikolenko/marlin/runs/frigid-distilled-stage0
  checkpoints: /mnt/netstorage/nikolenko/marlin/runs/frigid-distilled-stage0/checkpoints
  checkpoint_interval: 100

tracking:
  clearml:
    enabled: true
    project_name: MARLIN clean-room reproduction
    task_name: frigid-distilled-marlin-stage0
    tags:
      - FRIGID-distilled-MARLIN
      - not-strict-reproduction
      - stage-0
      - formula-teacher
      - fingerprint-teacher
