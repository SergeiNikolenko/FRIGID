# Controlled capacity expansion after attention-only stage1b failed its gate.
# This is FRIGID-distilled MARLIN, not a strict paper reproduction.
defaults:
  - marlin_frigid_distilled_stage1b
  - _self_

# Start from the same selected stage-0 checkpoint as stage1b so the failed
# attention-only weights cannot bias this comparison.
resume_weights_only_checkpoint: ???

adaptation:
  stage: stage1c-block32-next-token-top4-ffn
  trainable_scope: attention_plus_top4_ffn

optim:
  learning_rate: 5.0e-6

output:
  root: /mnt/netstorage/nikolenko/marlin/runs/frigid-distilled-stage1c-block32
  checkpoints: /mnt/netstorage/nikolenko/marlin/runs/frigid-distilled-stage1c-block32/checkpoints

tracking:
  clearml:
    task_name: frigid-distilled-marlin-stage1c-block32-top4-ffn
    tags:
      - FRIGID-distilled-MARLIN
      - not-strict-reproduction
      - stage-1c
      - block-attention-32
      - attention-plus-top4-ffn
      - next-token-rollout-distillation
      - raw-molecular-validation
      - formula-teacher
      - fingerprint-teacher
