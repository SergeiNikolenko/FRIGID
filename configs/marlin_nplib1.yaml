# Clean-room MARLIN reproduction from arXiv:2607.04774.
# max_steps and mass Fourier frequencies are explicitly inferred because the paper omits them.
seed: 42
resume_checkpoint: null
initial_weights_checkpoint: null
initial_weights_architecture_upgrade: false
initial_weights_use_ema: true
frigid_warm_start_checkpoint: /mnt/netstorage/nikolenko/marlin/checkpoints/frigid/DLM.ckpt
frigid_warm_start_sha256: b6177c2d43448380aba80ff41c01461ea34ca2ca93b213986954c5afb7f0f457

data:
  dataset: datamol-io/safe-gpt
  # Inferred: the paper does not identify its molecular training corpus.
  revision: 16d0be9ad6177ae683a32a86204530e8ee624a0f
  tokenizer_file: /home/nikolenko/work/Projects/MARLIN_reproduction_20260717/data/safe-gpt/tokenizer.json
  tokenizer_sha256: 0db5f4dbdc7e8ff759e98483759611a426e187ee7f3f0a91edc8800abe7bf140
  special_token_ids:
    unk: 0
    bos: 1
    eos: 2
    pad: 3
    mask: 4
  hf_cache_dir: /mnt/netstorage/nikolenko/marlin/cache/huggingface
  # Local content-addressed mirror; canonical training must not depend on HTTP streaming.
  snapshot_manifest: /mnt/netstorage/nikolenko/marlin/safe-gpt-16d0be9ad6177ae683a32a86204530e8ee624a0f/manifest.json
  snapshot_file_list_sha256: ca5356076d4e6e4920a019d55af0a769b0984d736f3feb9799045f3c49244e6f
  verify_snapshot_hashes: true
  # Test *and* val connectivity blocks. The list this replaced held the 701 test
  # blocks only, which left all 320 blocks of the clean 321 panel --- the panel we
  # iterate on --- eligible for corpus training.
  # 1,095 blocks, sha256 7d1f45937f284dbc9dc93be0ff6ae6eedf02b1cc293496acff7ffcd8c5dab44a
  exclude_inchikeys: /home/nikolenko/work/Projects/MARLIN_reproduction_20260717/data/nplib1_holdout_inchikeys_v2.csv
  # Inferred: preserve complete SAFE targets within the fixed 256-token context.
  length_audit_manifest: /home/nikolenko/work/Projects/MARLIN_reproduction_20260717/manifests/safe_gpt_eligibility_a7a49f6_first1000000.json
  length_audit_sha256: c6267bfcffe51b42fa82d3514cb148ba15fa9e7c0141119682aa12c64413b0fd
  shuffle_buffer: 100000
  filtered_prefix_cache_manifest: /mnt/netstorage/nikolenko/marlin/cache/filtered-safe-prefix-v1/manifest.json
  # Optional finite cache of the exact post-filter, post-shuffle stream. It
  # makes checkpoint resumes seekable instead of replaying every prior row.
  shuffled_stream_cache_manifest: null
  # Derived from canonical step=N checkpoints on exact resume. Set explicitly
  # only when importing a checkpoint whose prior stream position is known.
  stream_offset_examples: null

loader:
  batch_size: 8
  num_workers: 8

model:
  vocab_size: 1880
  hidden_size: 896
  num_layers: 12
  num_heads: 14
  intermediate_size: 3584
  max_length: 256
  block_width: 8
  fingerprint_bits: 4096
  dropout: 0.1
  layer_norm_eps: 1.0e-12
  cross_attention_layer_norm_eps: 1.0e-5
  fingerprint_layer_norm_eps: 1.0e-5
  fingerprint_layer_norm: true
  # Inferred from the released FRIGID warm-start checkpoint.
  fingerprint_self_attention_layers: 3
  frigid_compatible_layer_order: true
  mask_token_id: 4
  pad_token_id: 3

optim:
  learning_rate: 5.0e-5
  weight_decay: 0.0

training:
  ema_decay: 0.9999
  noise_probability: 0.5
  noise_min_fraction: 0.1
  noise_max_fraction: 0.3
  # Sparse reconstruction diagnostics reuse the training forward pass.
  metric_interval: 50

evaluation:
  enabled: true
  # Bounded validation-oracle lane: a decoder health gate, not a spectrum lane
  # and not the locked NPLIB1 test result. Full test evaluation stays separate.
  interval_steps: 5000
  metadata: /home/nikolenko/work/Projects/MARLIN_reproduction_20260717/data/processed/val/metadata.csv
  fingerprints: /home/nikolenko/work/Projects/MARLIN_reproduction_20260717/data/processed/val/fingerprints.npz
  fingerprint_key: ground_truth
  # Required when the selected fingerprint array contains probabilities.
  threshold: null
  lane: dreams
  max_spectra: 4
  candidates: 16
  diversity_dropout: 0.3
  temperature: 1.0
  ppm_tolerance: 10.0
  seed: 42

trainer:
  # Spectrum currently exposes one A100 through Slurm.
  devices: 1
  precision: bf16-mixed
  max_steps: 100000
  # 8 examples x 32 accumulation steps = paper batch size 256.
  accumulate_grad_batches: 32
  # Lightning treats zero as disabled; the training entry point rejects negatives.
  gradient_clip_val: 1.0
  log_every_n_steps: 50

output:
  root: /mnt/netstorage/nikolenko/marlin/runs/decoder
  checkpoints: /mnt/netstorage/nikolenko/marlin/runs/decoder/checkpoints
  checkpoint_interval: 5000

tracking:
  clearml:
    enabled: true
    project_name: MARLIN clean-room reproduction
    task_name: marlin-decoder
    tags:
      - clean-room
      - arxiv-2607.04774
      - SAFE
